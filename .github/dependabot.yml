version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x source generators require Microsoft.OpenApi 2.x.
      - dependency-name: Microsoft.OpenApi
        versions: [">=3.0.0"]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
        update-types:
          - "minor"
          - "patch"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
