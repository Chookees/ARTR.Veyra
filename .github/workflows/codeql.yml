name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - run: dotnet restore ARTR.Veyra.sln --locked-mode
      - run: dotnet build ARTR.Veyra.sln --configuration Release --no-restore
      - uses: github/codeql-action/analyze@v3
