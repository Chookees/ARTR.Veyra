name: Benchmarks

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  microbenchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore (locked)
        run: dotnet restore ARTR.Veyra.sln --locked-mode
      - name: Build benchmarks
        run: dotnet build benchmarks/ARTR.Veyra.Benchmarks/ARTR.Veyra.Benchmarks.csproj -c Release --no-restore
      - name: Run BenchmarkDotNet
        run: |
          dotnet run -c Release --project benchmarks/ARTR.Veyra.Benchmarks --no-build -- \
            --filter '*' --exporters json --artifacts artifacts/benchmarks
      - name: Soft regression gate
        shell: pwsh
        run: ./build/Check-Benchmark.ps1 -ResultsDir artifacts/benchmarks -SoftFail
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: artifacts/benchmarks
