name: Benchmarks

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  microbenchmarks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore (locked)
        run: dotnet restore ARTR.Veyra.sln --locked-mode
      - name: Build benchmarks
        run: dotnet build benchmarks/ARTR.Veyra.Benchmarks/ARTR.Veyra.Benchmarks.csproj -c Release --no-restore
      - name: Run BenchmarkDotNet
        run: |
          dotnet run -c Release --project benchmarks/ARTR.Veyra.Benchmarks --no-build -- \
            --filter '*' --exporters json --artifacts artifacts/benchmarks
      - name: Soft regression gate
        shell: pwsh
        run: ./build/Check-Benchmark.ps1 -ResultsDir artifacts/benchmarks -SoftFail
      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: artifacts/benchmarks
