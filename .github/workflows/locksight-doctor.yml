name: LockSight Doctor

on:
  push:
    branches: [master]
    paths:
      - 'Directory.Packages.props'
      - '**/*.*proj'
      - '**/packages.lock.json'
      - 'nuget.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
  pull_request:
    paths:
      - 'Directory.Packages.props'
      - '**/*.*proj'
      - '**/packages.lock.json'
      - 'nuget.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
  workflow_dispatch:

jobs:
  locksight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: Chookees/ARTR.LockSight@3f5e17ab7407b458c9d8ea8f06402ddc24032377 # v1.1.0
        with:
          path: .
          evaluate: "false"
