name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ARTR.Veyra.sln --locked-mode
      - name: Publish native artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/publish
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            dotnet publish src/ARTR.Veyra.Host/ARTR.Veyra.Host.csproj -c Release -r "$rid" --self-contained false -o "artifacts/publish/fdd-$rid"
            dotnet publish src/ARTR.Veyra.Host/ARTR.Veyra.Host.csproj -c Release -r "$rid" --self-contained true -o "artifacts/publish/scd-$rid" /p:PublishSingleFile=true
            tar -czf "artifacts/publish/artr-veyra-fdd-$rid.tar.gz" -C "artifacts/publish/fdd-$rid" .
            tar -czf "artifacts/publish/artr-veyra-scd-$rid.tar.gz" -C "artifacts/publish/scd-$rid" .
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artr-veyra-native
          path: artifacts/publish/*.tar.gz
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/publish/*.tar.gz
          generate_release_notes: true
