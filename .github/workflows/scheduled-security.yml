name: Scheduled security

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  nuget-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ARTR.Veyra.sln --locked-mode
      - run: dotnet list ARTR.Veyra.sln package --vulnerable --include-transitive
