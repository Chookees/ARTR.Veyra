# Alias of nginx.example.conf — prefer deploy/reverse-proxy/nginx.example.conf for new deployments.
# Sample nginx edge configuration in front of ARTR Veyra (no containers required).
upstream veyra {
    server 127.0.0.1:5080;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://veyra;
    }
}
